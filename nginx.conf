server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router: any URL that isn't a real file returns index.html,
    # so /orders or /checkout still work after a browser refresh
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite adds a hash to asset filenames, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}